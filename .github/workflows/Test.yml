name: Tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/Test.yml'
      - 'composer.json'
      - 'phpcs.xml.dist'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/Test.yml'
      - 'composer.json'
      - 'phpcs.xml.dist'
      - 'phpstan.neon.dist'
      - 'phpunit.xml.dist'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5', '8.6']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run checks
        run: composer check
